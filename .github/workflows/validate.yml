# Fast structural checks that need no model key: the Agent Skills reference
# validator and the eval datasets.
name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Validate skills against the Agent Skills specification
        run: |
          for skill in skills/*/; do
            uvx --python 3.13 --from skills-ref==0.1.1 agentskills validate "$skill"
          done
      - name: Validate eval cases, fixtures and the model matrix
        run: node scripts/eval-matrix.mjs --check
