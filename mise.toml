# Tools and tasks for this repository. Run `mise install` once, then
# `mise run <task>` (or `mise tasks` to list them).

[tools]
node = "22"
pnpm = "12"
uv = "latest"
"aqua:gitleaks/gitleaks" = "8.30.1"
# Harbor runs the live evaluations (scripts/eval-matrix.mjs).
"pipx:harbor" = { version = "0.27.0", uvx_args = "--python 3.13" }
# SkillEvaluator for Tier 1 (validation, security) and Tier 2 (deduplication); needs Python 3.12-3.14.
"pipx:skillevaluator" = { version = "1.0.1", extras = "all", uvx_args = "--python 3.13" }

[tasks.validate]
description = "Validate each skill against the Agent Skills specification"
run = "npm run -s validate"

[tasks."eval:check"]
description = "Validate the eval cases, fixtures and model matrix"
run = "npm run -s eval:check"

[tasks."check:harness"]
description = "Show whether each agent harness loads the skills"
run = "npm run -s check:harness"

[tasks."check:tier1"]
description = "SkillEvaluator Tier 1: quality score and security scan"
run = "npm run -s check:tier1"

[tasks."check:tier2"]
description = "SkillEvaluator Tier 2: repeated content and overlap between skills (calls a model provider)"
run = "node scripts/dedup.mjs"

[tasks.check]
description = "All checks that need no model key"
depends = ["validate", "eval:check", "check:tier1"]

[tasks."eval:dry"]
description = "Generate the Harbor tasks and validate each job without calling a model"
run = "node scripts/eval-matrix.mjs --dry-run"

[tasks.eval]
description = "Run live evaluations (calls model providers; costs money). Pass options after --"
run = "node scripts/eval-matrix.mjs"

[tasks."eval:summary"]
description = "Rebuild the evaluation summary from results on disk"
run = "node scripts/eval-matrix.mjs --summary-only"
